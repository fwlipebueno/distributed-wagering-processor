name: jungle-wager
x-app: &app
  build: .
  environment: &environment
    DATABASE_URL: postgresql://wager:wager@postgres:5432/wager
    SQS_ENDPOINT: http://localstack:4566
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    APP_ROLE: api
    PORT: 3000
  depends_on:
    migrate:
      condition: service_completed_successfully
    localstack:
      condition: service_healthy
  init: true
  restart: unless-stopped
  stop_grace_period: 40s
  healthcheck:
    test: [CMD, bun, -e, "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 10s
    timeout: 5s
    retries: 6
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: wager
      POSTGRES_PASSWORD: wager
      POSTGRES_DB: wager
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U wager -d wager]
      interval: 2s
      timeout: 3s
      retries: 30
  localstack:
    image: localstack/localstack:4.10.0
    environment:
      SERVICES: sqs
      SQS_ENDPOINT_STRATEGY: path
      AWS_DEFAULT_REGION: us-east-1
    ports: ["127.0.0.1:4566:4566"]
    healthcheck:
      test: [CMD, awslocal, sqs, list-queues]
      interval: 3s
      timeout: 5s
      retries: 30
  migrate:
    build: .
    environment:
      <<: *environment
    command: [bun, dist/src/infrastructure/migrate.js, up]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *app
    ports: ["127.0.0.1:3000:3000"]
  api-2:
    <<: *app
    ports: ["127.0.0.1:3001:3000"]
  api-3:
    <<: *app
    ports: ["127.0.0.1:3002:3000"]
  worker:
    <<: *app
    environment:
      <<: *environment
      APP_ROLE: worker
    deploy:
      replicas: 2
  test:
    profiles: [tests]
    build:
      context: .
      target: test
    environment:
      <<: *environment
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
volumes:
  postgres-data:
